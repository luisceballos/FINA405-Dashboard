// shock in decimal, positive = currency gains vs USD, negative = currency loses vs USD

const EVENTS = [
{id:"tequila",year:1994,date:"Dec 20, 1994",title:"Tequila Crisis — Mexico Devaluation",ccy:"USD/MXN",channels:["fiscal","monetary"],
 series:[{label:"USD/MXN",base:0.295,shock:-0.52,vol:0.008,trend:-0.0002,revert:0.04}],
 bg:`In 1994, Mexico maintained a fixed exchange rate (peso pegged near 3.4 per USD) despite chronic current account deficits financed by short-term dollar debt (Tesobonos). Political shocks — the Chiapas uprising and two political assassinations — accelerated capital flight. Foreign reserves collapsed from $28bn to $6bn in months. The government had no choice but to devalue.`,
 what:`On December 20, incoming Finance Minister Serra Puche announced an unexpected 15% devaluation. Instead of calming markets, it signalled weakness. Investors panicked and sold ALL peso assets — the peso fell 50% within weeks. The US organized a $50bn emergency rescue package (the first IMF-led EM bailout of its scale) within weeks.`,
 chain:["Fixed rate unsustainable","Reserves depleted","Surprise devaluation","Market panic (supply of MXN surges)","Run on Tesobonos","US/IMF rescue package"],
 highlights:[{val:"−50%",label:"MXN loss vs USD in 8 weeks"},{val:"$50bn",label:"US emergency rescue package"},{val:"7%",label:"Mexico GDP contraction in 1995"},{val:"50%",label:"Mexican interest rates at peak"}]},

{id:"asian97",year:1997,date:"Jul 2, 1997",title:"Asian Financial Crisis",ccy:"THB · KRW · IDR",channels:["fiscal","carry","safe"],
 series:[{label:"USD/THB",base:0.039,shock:-0.55,vol:0.007,trend:-0.0001,revert:0.03},{label:"USD/KRW",base:0.00115,shock:-0.48,vol:0.006,trend:-0.0001,revert:0.035}],
 bg:`Asian "tiger" economies ran large current account deficits financed by dollar-denominated short-term debt, while maintaining quasi-fixed pegs to USD. When the Thai baht came under speculative attack, the contagion spread rapidly. George Soros and other hedge funds shorted Asian currencies aggressively. The IMF attached severe austerity conditions to rescue packages, deepening the recessions.`,
 what:`Thailand abandoned its USD peg on July 2, 1997. The baht fell 18% that day. Within months, Indonesia (IDR −80%), South Korea (KRW −48%), Malaysia, and the Philippines followed. Korea needed a $57bn IMF bailout — then the largest in history. Indonesia's GDP contracted 13.1% in 1998. 24 million people fell into poverty across Asia.`,
 chain:["Pegged currencies + USD debt","Current account deficits","Speculative attacks begin","Reserves collapse","Pegs abandoned","Contagion across region"],
 highlights:[{val:"−80%",label:"Indonesian Rupiah loss"},{val:"−48%",label:"Korean Won loss"},{val:"$57bn",label:"Korea IMF bailout"},{val:"−13%",label:"Indonesia GDP 1998"}]},

{id:"brazil99",year:1999,date:"Jan 13, 1999",title:"Brazil Real Devaluation",ccy:"USD/BRL",channels:["fiscal","monetary"],
 series:[{label:"USD/BRL",base:0.850,shock:-0.42,vol:0.010,trend:-0.0003,revert:0.035}],
 bg:`After the Asian crisis, Brazil kept the real in a crawling peg system to attract foreign capital. High domestic interest rates (>40%) kept money in Brazil — but at enormous fiscal cost. As the Asian and Russian crises deepened global risk aversion, capital fled EM. Brazil spent $40bn of reserves defending the peg in months. Governor of Minas Gerais Itamar Franco announced he would default on his state's debts in January 1999.`,
 what:`On January 13, 1999, Brazil widened the exchange rate band, effectively devaluing. Two days later they abandoned the peg entirely. The real fell 40% in a month. Contrary to predictions, Brazil's economy recovered quickly — inflation stayed relatively contained thanks to an inflation-targeting framework adopted immediately after the float.`,
 chain:["Crawling peg under pressure","Minas Gerais default shock","Reserve depletion","Band widened → abandoned","Real floats freely","Inflation targeting adopted"],
 highlights:[{val:"−40%",label:"BRL loss vs USD (Jan–Feb 1999)"},{val:"$40bn",label:"Reserves spent defending peg"},{val:"45%",label:"Brazilian interest rates pre-devaluation"},{val:"+4.2%",label:"Brazil GDP recovery in 2000"}]},

{id:"plaza",year:1985,date:"Sep 22, 1985",title:"Plaza Accord — Coordinated USD Devaluation",ccy:"USD/DEM · USD/JPY",channels:["intervention","trade"],
 series:[{label:"DEM/USD (proxy EUR)",base:0.41,shock:+0.08,vol:0.005,trend:0.0001,revert:0.02},{label:"USD/JPY",base:0.0042,shock:+0.10,vol:0.004,trend:0.0001,revert:0.02}],
 bg:`By 1985 the USD had appreciated 50% since 1980, driven by high US interest rates under Volcker. The strong dollar decimated US manufacturing competitiveness and created massive trade deficits with Japan, Germany, France, and UK. US protectionist legislation was gaining momentum in Congress, threatening global trade.`,
 what:`Finance ministers of the G5 (US, Japan, West Germany, France, UK) met secretly at the Plaza Hotel in New York and agreed to jointly intervene to depreciate the dollar. Central banks sold dollars simultaneously. The USD fell 50% vs DEM and 51% vs JPY over the next two years — the only successful multilateral FX coordination in modern history.`,
 chain:["USD 50% overvalued","US trade deficits surge","Protectionist pressure in Congress","G5 secret Plaza meeting","Coordinated central bank sales of USD","USD falls 50% in 2 years"],
 highlights:[{val:"−50%",label:"USD vs DEM in 2 years"},{val:"−51%",label:"USD vs JPY in 2 years"},{val:"G5",label:"Coordinated intervention — unprecedented"},{val:"1985",label:"Only successful multilateral FX accord"}]},

{id:"911",year:2001,date:"Sep 11, 2001",title:"9/11 Attacks — Market Shock",ccy:"USD/JPY · EUR/USD",channels:["safe","monetary"],
 series:[{label:"USD/JPY",base:0.00840,shock:+0.025,vol:0.005,trend:0,revert:0.05},{label:"EUR/USD",base:0.910,shock:-0.018,vol:0.006,trend:0,revert:0.04}],
 bg:`The 9/11 attacks on the World Trade Center and Pentagon caused an immediate global risk-off shock. US equity markets were closed for 4 days — the longest closure since the Great Depression. The Fed cut rates 50bp on September 17 in an emergency move, then cut 5 more times in 2001.`,
 what:`In the hours after the attacks, the yen and Swiss franc surged as safe havens. European markets fell sharply before US markets reopened. The USD initially fell on global uncertainty, then recovered as the Fed's emergency cuts and market reopening stabilized sentiment. The attack accelerated the US recession already underway, leading to the deepest rate cut cycle since the 1980s.`,
 chain:["Unprecedented security shock","Global risk-off","Flight to JPY and CHF","Fed emergency 50bp cut","Markets closed 4 days","Economic recession deepens"],
 highlights:[{val:"−14%",label:"S&P 500 in week of reopening"},{val:"50bp",label:"Fed emergency cut Sep 17"},{val:"4 days",label:"NYSE closed — longest since 1929"},{val:"5",label:"Additional Fed cuts through 2001"}]},

{id:"argentina01",year:2001,date:"Dec 1, 2001",title:"Argentina Default & Convertibility Collapse",ccy:"USD/ARS",channels:["fiscal","monetary"],
 series:[{label:"USD/ARS (official)",base:1.00,shock:-0.67,vol:0.012,trend:-0.0001,revert:0.01}],
 bg:`Argentina maintained a 1:1 currency board (peso = dollar) since 1991. This eliminated inflation but removed all monetary policy flexibility. After Brazil devalued in 1999, Argentina lost competitiveness. GDP fell for 3 consecutive years. The government imposed the "corralito" — freezing bank deposits — on December 1, 2001.`,
 what:`Argentina defaulted on $100bn of sovereign debt on December 23 — the largest sovereign default in history at that time. In January 2002, President Duhalde announced the end of convertibility. The peso was devalued to 1.4:1, then floated freely, falling to 3.9:1 by mid-2002. Savings in USD were converted to pesos at 1.4 ("pesification") — wiping out 64% of dollar depositors' wealth overnight.`,
 chain:["Currency board with overvalued ARS","Recession 3 years","Bank freeze (corralito)","$100bn sovereign default","Convertibility abolished","ARS floated → −75%"],
 highlights:[{val:"$100bn",label:"Largest sovereign default (2001)"},{val:"−75%",label:"ARS loss after devaluation"},{val:"−10.9%",label:"Argentina GDP contraction 2002"},{val:"64%",label:"Dollar savings wiped out by pesification"}]},

{id:"lehman",year:2008,date:"Sep 15, 2008",title:"Lehman Brothers Collapse — GFC",ccy:"USD · JPY · EM",channels:["safe","carry","monetary"],
 series:[{label:"USD/JPY",base:0.00912,shock:+0.06,vol:0.008,trend:0.0001,revert:0.03},{label:"EUR/USD",base:1.42,shock:-0.08,vol:0.010,trend:-0.0001,revert:0.04}],
 bg:`Lehman Brothers, the 4th-largest US investment bank, filed for bankruptcy on September 15, 2008 — the largest bankruptcy in US history. The collapse froze global dollar funding markets. Banks stopped lending to each other (LIBOR spiked). USD became scarce worldwide as dollar-denominated credit contracted instantly.`,
 what:`Paradoxically, USD surged despite being the epicenter of the crisis — because global banks needed dollars to fund their USD-denominated liabilities. JPY surged as the largest carry trade in history (borrow yen, buy EM and risk assets) unwound simultaneously. EM currencies collapsed 20-40%. The Fed opened emergency dollar swap lines with 14 central banks worldwide to address the dollar shortage.`,
 chain:["Lehman bankruptcy","Dollar funding markets freeze","USD scarce globally","Carry trade unwinds simultaneously","JPY and USD surge","EM currencies collapse 20-40%"],
 highlights:[{val:"$639bn",label:"Lehman bankruptcy size"},{val:"+25%",label:"JPY appreciation vs USD (3 months)"},{val:"−40%",label:"Typical EM currency loss"},{val:"14",label:"Central banks receiving Fed dollar swaps"}]},

{id:"taptan",year:2013,date:"May 22, 2013",title:"Fed Taper Tantrum",ccy:"EM currencies",channels:["monetary","carry"],
 series:[{label:"USD/BRL",base:0.493,shock:-0.08,vol:0.007,trend:-0.0001,revert:0.03},{label:"USD/INR",base:0.0183,shock:-0.09,vol:0.006,trend:-0.0002,revert:0.025}],
 bg:`After years of QE (quantitative easing), Fed Chairman Ben Bernanke told Congress on May 22, 2013 that the Fed "could" slow the pace of bond purchases "in the next few meetings." This was a minor, conditional statement — but markets reacted as if the era of easy money was ending. EM markets, which had received enormous capital inflows during QE, reversed sharply.`,
 what:`US Treasury 10-year yields surged from 1.6% to 3% in months. Capital flooded back from EM to the US, as the interest rate differential that had driven EM inflows reversed. India's rupee fell 20%, Brazil's real fell 18%, Indonesia's rupiah fell 22%, South Africa's rand fell 25%. EM central banks raised rates defensively. The Fed did not actually taper until December 2013.`,
 chain:["Bernanke hints at tapering QE","US yields surge","EM interest rate differential narrows","Capital flows reverse from EM to US","EM currencies sold","EM central banks raise rates defensively"],
 highlights:[{val:"−20%",label:"Indian Rupee loss"},{val:"−22%",label:"Indonesian Rupiah loss"},{val:"+1.4%",label:"US 10Y yield jump in 4 months"},{val:"Dec 2013",label:"Actual taper start — 7 months later"}]},

{id:"ecbneg",year:2014,date:"Jun 5, 2014",title:"ECB Negative Interest Rates",ccy:"EUR/USD",channels:["monetary","carry"],
 series:[{label:"EUR/USD",base:1.363,shock:-0.025,vol:0.006,trend:-0.0002,revert:0.03}],
 bg:`After the Eurozone debt crisis, the ECB had cut rates to near zero but still faced deflation risk and a stagnant economy. ECB President Mario Draghi decided to take the unprecedented step of charging banks to deposit money at the ECB — negative deposit rates. This was uncharted territory for a major central bank.`,
 what:`On June 5, 2014, the ECB cut its deposit rate to −0.10% — the first major central bank to go negative. EUR fell 15% vs USD over the next year as the policy diverged from a Fed preparing to hike. The move sparked a long debate about the effectiveness of negative rates — do they stimulate or do they hurt banks and signal desperation? EUR fell from 1.40 to 1.05 by March 2015.`,
 chain:["Eurozone deflation risk","Zero rate policy ineffective","ECB cuts to negative territory","EUR carry trade reverses","Capital leaves Eurozone","EUR falls toward parity with USD"],
 highlights:[{val:"−0.10%",label:"First major CB negative rate"},{val:"−25%",label:"EUR/USD over following year"},{val:"1.05",label:"EUR/USD low in Mar 2015 (from 1.40)"},{val:"€1.1tn",label:"QE announced alongside — 'Draghi Bazooka'"}]},

{id:"snb15",year:2015,date:"Jan 15, 2015",title:"SNB Black Swan — CHF Cap Removal",ccy:"EUR/CHF · USD/CHF",channels:["intervention","carry"],
 series:[{label:"USD/CHF",base:1.022,shock:+0.30,vol:0.008,trend:0.0001,revert:0.06}],
 bg:`In September 2011, as the Eurozone crisis drove safe-haven flows into CHF, the Swiss Franc appreciated so violently that the SNB imposed a cap: they would buy unlimited EUR to keep EUR/CHF above 1.20. For 3 years the SNB intervened massively, accumulating over €500bn in foreign reserves — equal to 80% of Swiss GDP. As ECB prepared for major QE in early 2015, defending the cap would require unlimited EUR purchases.`,
 what:`On January 15, 2015, with no warning whatsoever, SNB Chairman Thomas Jordan announced the floor was abandoned. In minutes, EUR/CHF fell from 1.20 to 0.85 — a 29% move. USD/CHF fell 30%. It was the largest single-day move in a major currency in modern history. Dozens of currency brokers went bankrupt from client losses. The Polish mortgage crisis (many Poles had CHF mortgages) deepened overnight.`,
 chain:["SNB caps CHF at 1.20 vs EUR (2011)","ECB announces QE → EUR to weaken","Defending cap requires unlimited buying","SNB abandons floor with zero warning","CHF surges 30% in minutes","Brokers bankrupted, EM CHF-debtors devastated"],
 highlights:[{val:"30%",label:"CHF surge in minutes — single largest move"},{val:"0.85",label:"EUR/CHF low (from 1.20 floor)"},{val:"€500bn",label:"SNB reserves accumulated defending cap"},{val:"Jan 15",label:"'SNB Day' — still cited as tail risk example"}]},

{id:"chindeval",year:2015,date:"Aug 11, 2015",title:"China Surprise Devaluation — CNY Fix",ccy:"USD/CNY · AUD · EM",channels:["monetary","trade"],
 series:[{label:"USD/CNY",base:0.1612,shock:-0.028,vol:0.003,trend:-0.0001,revert:0.04},{label:"AUD/USD",base:0.735,shock:-0.035,vol:0.007,trend:-0.0002,revert:0.04}],
 bg:`China had maintained a tightly managed CNY peg for years, with only gradual appreciation. By mid-2015, Chinese exports were slowing, the stock market had crashed 30%, and capital was flowing out. The People's Bank of China changed its daily fix mechanism — ostensibly to make it more market-oriented, but the first fix was 1.9% weaker than expected.`,
 what:`On August 11, 2015, the PBoC set the CNY fix 1.9% weaker, the largest single-day devaluation in decades. Markets interpreted it as the start of a competitive devaluation to boost exports. Global commodity currencies (AUD, CAD, BRL) fell sharply as the implied demand for commodities dropped. EM currencies fell broadly. Chinese reserves fell $100bn/month as the PBoC then had to defend CNY from further weakness.`,
 chain:["China growth slows, exports fall","PBoC changes fix mechanism","1.9% devaluation announcement","EM and commodity FX sell-off","Global deflation fears increase","China spends $1tn defending CNY"],
 highlights:[{val:"−1.9%",label:"CNY devaluation — shock to markets"},{val:"−$1tn",label:"Chinese FX reserves spent Aug–Jan"},{val:"−8%",label:"AUD/USD in following week"},{val:"3%",label:"Global equities lost in 3 days"}]},

 series:[{label:"GBP/USD",base:1.488,shock:-0.10,vol:0.009,trend:0.0001,revert:0.025}],
 bg:`The UK held a referendum on EU membership on June 23, 2016. Polls showed a narrow Remain lead. Currency markets priced a ~75% probability of Remain — GBP had been rising for days before the vote. When counting began through the night, early results showed Leave performing better than expected.`,
 what:`As Leave results poured in through the night of June 23-24, GBP fell in real time. By 5am London time, GBP/USD had fallen from 1.50 to 1.32 — a 10% overnight collapse, the largest single-day GBP move in history. Prime Minister Cameron resigned by morning. The pound stayed depressed for years. The uncertainty over trade relations with Europe suppressed UK investment and growth for a decade.`,
 chain:["Referendum → Leave wins unexpectedly","Political uncertainty spikes","UK trade outlook deteriorates","PM Cameron resigns 7am","GBP supply surges as investors flee UK assets","GBP hits 31-year lows"],

// ═══════════════════════════════════════════════════════════════════
// DATA GENERATION — Seeded random walk with event shock
// ═══════════════════════════════════════════════════════════════════
function seededRng(seed){
  let s=seed>>>0;
  return()=>{s=(Math.imul(1664525,s)+1013904223)>>>0;return s/4294967296;};
}

function genSeries(cfg,seed){
  const {base,shock,vol,trend,revert}=cfg;
  const rng=seededRng(seed);
  const N=121,evDay=60;
  const arr=[base];
  for(let i=1;i<N;i++){
    const prev=arr[i-1];
    let chg;
    if(i<evDay){
      // pre-event: drift + noise
      chg=prev*(trend/252)+prev*vol*(rng()-0.5)*2.2;
    } else if(i===evDay){
      // event shock (may span 1-2 days)
      chg=prev*shock*0.75;
    } else if(i===evDay+1){
      chg=prev*shock*0.25+prev*vol*(rng()-0.5)*2.2;
    } else {
      // post: mean-reversion + noise
      const target=arr[evDay]*(1+shock);
      chg=revert*(target-prev)+prev*vol*(rng()-0.5)*2.2;
    }
    arr.push(prev+chg);
  }
  // Normalize to % change from event Day 0 (index 60) so all pairs are comparable
  const base0 = arr[59];
  return arr.map(v => (v / base0 - 1) * 100);
}

// BUILD UI
// ═══════════════════════════════════════════════════════════════════
const CHANNELS_ALL=[...new Set(EVENTS.flatMap(e=>e.channels))];
let activeFilters=new Set();
let animTimer=null,animFrame=0,animData=null,animSpeed=1;

function buildFilterPills(){
  const fp=document.getElementById("filter-pills");
  CHANNELS_ALL.forEach(c=>{
    const span=document.createElement("span");
    span.className=`fpill ${CH[c].css}`;
    span.textContent=`${CH[c].icon} ${CH[c].label}`;
    span.onclick=()=>{
      if(activeFilters.has(c)){activeFilters.delete(c);span.classList.remove("on");}
      else{activeFilters.add(c);span.classList.add("on");}
      filterEvents();
    };
    fp.appendChild(span);
  });
}

function buildEventList(){
  const el=document.getElementById("ev-list");
  EVENTS.forEach(ev=>{
    const d=document.createElement("div");
    d.className="ev-item";
    d.id=`evi-${ev.id}`;
    d.innerHTML=`<div class="ei-year">${ev.date}</div><div class="ei-title">${ev.title}</div><div class="ei-ccy">${ev.ccy}</div>`;
    d.onclick=()=>showEvent(ev.id);
    el.appendChild(d);
  });
}

function filterEvents(){
  const q=document.getElementById("ev-search").value.toLowerCase();
  EVENTS.forEach(ev=>{
    const el=document.getElementById(`evi-${ev.id}`);
    const matchQ=!q||ev.title.toLowerCase().includes(q)||String(ev.year).includes(q)||ev.ccy.toLowerCase().includes(q);
    const matchF=activeFilters.size===0||ev.channels.some(c=>activeFilters.has(c));
    el.style.display=(matchQ&&matchF)?'':'none';
  });
}

// SHOW EVENT
// ═══════════════════════════════════════════════════════════════════
function showEvent(id){
  const ev=EVENTS.find(e=>e.id===id);
  document.querySelectorAll(".ev-item").forEach(e=>e.classList.remove("active"));
  document.getElementById(`evi-${ev.id}`).classList.add("active");

  const badges=ev.channels.map(c=>`<span class="badge ${CH[c].css}">${CH[c].icon} ${CH[c].label}</span>`).join("");
  const hlCards=ev.highlights.map(h=>`<div class="hl-card"><div class="hl-val">${h.val}</div><div class="hl-label">${h.label}</div></div>`).join("");
  const sdBoxes=ev.chain.map((s,i)=>`<span class="sd-box">${s}</span>${i<ev.chain.length-1?'<span class="sd-arr">→</span>':""}`).join("");

  document.getElementById("content-inner").innerHTML=`
    <div class="ev-header">
      <div class="eh-date">${ev.date} &nbsp;·&nbsp; ${ev.ccy}</div>
      <h2>${ev.title}</h2>
      <div class="badge-row">${badges}</div>
    </div>

    <nav class="ctx-tabs">
      <button class="ctx-tab active" onclick="ctxTab('bg',this)">📖 Background</button>
      <button class="ctx-tab" onclick="ctxTab('what',this)">⚡ What Happened</button>
      <button class="ctx-tab" onclick="ctxTab('chain',this)">🔗 S&amp;D Chain</button>
    </nav>

    <div id="ctx-bg" class="ctx-panel active">
      <p class="section-h">Context &amp; Background</p>
      <p class="body-text">${ev.bg}</p>
      <div class="highlights">${hlCards}</div>
    </div>
    <div id="ctx-what" class="ctx-panel">
      <p class="section-h">What Happened &amp; Market Impact</p>
      <p class="body-text">${ev.what}</p>
    </div>
    <div id="ctx-chain" class="ctx-panel">
      <p class="section-h">Supply &amp; Demand Transmission Chain</p>
      <div class="sd-chain">${sdBoxes}</div>
    </div>

    <div class="chart-area">
      <div class="chart-controls">
        <button class="ctrl-btn" id="play-btn" onclick="playAnim()">▶ Play (20s)</button>
        <button class="ctrl-btn pause" onclick="resetAnim()">↺ Reset</button>
        <select class="speed-sel" onchange="setSpeed(this.value)">
          <option value="1">1× speed</option>
          <option value="2">2× speed</option>
          <option value="0.5">0.5× speed</option>
        </select>
        <div class="progress-bar"><div class="progress-fill" id="prog-fill"></div></div>
        <span class="chart-label" id="day-label">Day −60</span>
      </div>
      <div id="anim-chart"></div>
      <div id="chart-note" class="chart-note"></div>
    </div>`;

  stopAnim();
  prepareAnim(ev);
  initChart(ev);
}

function ctxTab(name,btn){
  document.querySelectorAll(".ctx-panel").forEach(p=>p.classList.remove("active"));
  document.querySelectorAll(".ctx-tab").forEach(t=>t.classList.remove("active"));
  document.getElementById(`ctx-${name}`).classList.add("active");
  btn.classList.add("active");
}

// ═══════════════════════════════════════════════════════════════════
// ANIMATION
// ═══════════════════════════════════════════════════════════════════
const DAYS=Array.from({length:121},(_,i)=>i-60);

function prepareAnim(ev){
  animData=ev.series.map((s,si)=>({
    series:s,
    values:genSeries(s,ev.year*100+si*37+si)
  }));
  animFrame=0;
}

function initChart(ev){
  const colors=["#2563eb","#d97706","#22c55e","#8b5cf6"];
  const traces=animData.map((d,i)=>({
    x:[DAYS[0]],y:[d.values[0]],
    mode:"lines",name:d.series.label,
    line:{color:colors[i%colors.length],width:2.5}
  }));
  // Event marker shape
  const shapes=[
    {type:"line",x0:0,x1:0,y0:0,y1:1,xref:"x",yref:"paper",
     line:{color:"#ef4444",width:1.5,dash:"dot"}},
    {type:"rect",x0:-60,x1:0,y0:0,y1:1,xref:"x",yref:"paper",
     fillcolor:"#2563eb08",line:{width:0}},
    {type:"rect",x0:0,x1:60,y0:0,y1:1,xref:"x",yref:"paper",
     fillcolor:"#d9780608",line:{width:0}},
  ];
  const annotations=[
    {x:0,y:1.04,xref:"x",yref:"paper",text:"Event Day 0",showarrow:false,
     font:{color:"#ef4444",size:11},xanchor:"center"},
    {x:-30,y:1.04,xref:"x",yref:"paper",text:"← Before",showarrow:false,
     font:{color:"#60a5fa",size:10},xanchor:"center"},
    {x:30,y:1.04,xref:"x",yref:"paper",text:"After →",showarrow:false,
     font:{color:"#fbbf24",size:10},xanchor:"center"},
  ];
  Plotly.newPlot("anim-chart",traces,{
    paper_bgcolor:"#0f172a",plot_bgcolor:"#1e293b",font:{color:"#f1f5f9"},
    height:320,
    xaxis:{gridcolor:"#334155",zerolinecolor:"#475569",title:{text:"Days relative to event",font:{color:"#94a3b8",size:11}},range:[-62,62]},
    yaxis:{gridcolor:"#334155",title:{text:"% Change from Event Day 0",font:{color:"#94a3b8",size:11}},ticksuffix:"%",tickformat:".1f",zeroline:true,zerolinecolor:"#ef444466",zerolinewidth:1},
    legend:{bgcolor:"#1e293b",orientation:"h",y:-0.22},
    shapes,annotations,
    margin:{l:65,r:20,t:38,b:60}
  },{responsive:true,displayModeBar:false});

  // Reading guide below chart
  const noteEl = document.getElementById("chart-note");
  if(noteEl && ev && ev.ccy){
    const pairs = ev.ccy.split(/[·,]+/).map(s=>s.trim()).filter(Boolean);
    const lines = pairs.map(p=>{
      if(/^USD\//.test(p)) return `<b>${p}</b>: rising line = <span class='note-up'>USD strengthens</span> / ${p.split('/')[1]} weakens`;
      if(/\/USD$/.test(p)) return `<b>${p}</b>: rising line = <span class='note-up'>${p.split('/')[0]} strengthens</span> / USD weakens`;
      if(/^EUR\/CHF/.test(p)) return `<b>${p}</b>: rising line = <span class='note-up'>EUR strengthens</span> / CHF weakens`;
      return `<b>${p}</b>: rising = first currency strengthens vs second`;
    });
    noteEl.innerHTML = `<span class="note-icon">📖 How to read:</span> ` + lines.join(' &nbsp;·&nbsp; ');
  }
}

function playAnim(){
  if(animTimer) return;
  if(animFrame>=120){animFrame=0;resetAnimChart();}
  const totalMs=20000/animSpeed;
  const stepMs=totalMs/120;
  document.getElementById("play-btn").textContent="⏸ Playing…";
  document.getElementById("play-btn").classList.add("pause");
  animTimer=setInterval(()=>{
    animFrame++;
    const xArr=animData.map(d=>DAYS.slice(0,animFrame+1));
    const yArr=animData.map(d=>d.values.slice(0,animFrame+1));
    animData.forEach((d,i)=>{
      Plotly.extendTraces("anim-chart",{x:[xArr[i]],y:[yArr[i]]},[i],animFrame+1);
    });
    const pct=((animFrame)/120*100).toFixed(0);
    document.getElementById("prog-fill").style.width=pct+"%";
    document.getElementById("day-label").textContent=`Day ${DAYS[animFrame]>=0?"+":""}${DAYS[animFrame]}`;
    if(animFrame>=120){
      stopAnim();
      document.getElementById("play-btn").textContent="▶ Play (20s)";
      document.getElementById("play-btn").classList.remove("pause");
    }
  },stepMs);
}

function stopAnim(){
  if(animTimer){clearInterval(animTimer);animTimer=null;}
  const btn=document.getElementById("play-btn");
  if(btn){btn.textContent="▶ Play (20s)";btn.classList.remove("pause");}
}

function resetAnim(){
  stopAnim();
  animFrame=0;
  const pf=document.getElementById("prog-fill");
  const dl=document.getElementById("day-label");
  if(pf) pf.style.width="0%";
  if(dl) dl.textContent="Day −60";
  resetAnimChart();
}

function resetAnimChart(){
  if(!animData) return;
  const update={x:animData.map(()=>[DAYS[0]]),y:animData.map(d=>[d.values[0]])};
  const indices=animData.map((_,i)=>i);
  // Redraw from scratch
  initChart({series:animData.map(d=>d.series)});
}

function setSpeed(v){animSpeed=parseFloat(v);}

buildEventList();
</script>
